<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>クレーン判定アプリ（仮） V46</title>
    <style>
        :root { --bg-safe: #ffffff; --bg-caution: #ffff99; --bg-danger: #ffe0e0; --bg-error: #ffcccc; --bg-success: #ccffcc; --accent: #007bff; --success: #28a745; --waiting: #f0f0f0; }
        body { font-family: sans-serif; margin: 0; padding: 0; background-color: #f0f0f0; color: #333; }
        
        #fixed-header { position: sticky; top: 0; z-index: 1000; background: #fff; border-bottom: 2px solid #ccc; padding: 5px 10px; }
        
        /* 免責事項（赤枠） */
        .disclaimer { color: #f00; font-size: 0.75rem; font-weight: bold; text-align: center; border: 1px solid #f00; padding: 2px; margin-bottom: 4px; }
        
        /* アプリ名（濃い青・太文字・一行） */
        .app-title { color: #000080; font-size: 1.2rem; font-weight: 900; text-align: center; white-space: nowrap; margin: 4px 0; }
        
        /* 判定パネル */
        #display-panel { display: flex; align-items: center; border-radius: 8px; padding: 5px; border: 2px solid #000; background-color: var(--waiting); transition: 0.3s; }
        .ratio-wrapper { text-align: center; flex: 0 0 35%; border-right: 2px solid #ccc; }
        .status-label { font-size: 0.9rem; font-weight: bold; background: #000; color: #fff; padding: 1px 8px; border-radius: 4px; }
        .result-main { font-size: 2.8rem; font-weight: 900; line-height: 1.1; }
        .info-wrapper { flex: 1; padding-left: 10px; font-size: 0.85rem; font-weight: bold; }
        
        #content { padding: 10px; padding-bottom: 60px; }
        h2 { font-size: 1.1rem; border-left: 8px solid #333; background: #ddd; padding: 4px 10px; margin: 12px 0 8px; }
        h3 { font-size: 0.95rem; margin: 8px 0 4px; color: #555; }
        
        .input-view { width: 100%; font-size: 1.4rem; padding: 8px; border: 2px solid #333; border-radius: 6px; box-sizing: border-box; text-align: right; font-weight: bold; margin-bottom: 8px; }
        .red-note { color: #f00; font-size: 0.8rem; font-weight: bold; margin-bottom: 8px; display: block; }
        
        .grid { display: grid; gap: 6px; margin-bottom: 12px; }
        .cols-2 { grid-template-columns: repeat(2, 1fr); }
        .cols-3 { grid-template-columns: repeat(3, 1fr); }
        .cols-4 { grid-template-columns: repeat(4, 1fr); }
        
        button { height: 48px; font-size: 0.95rem; font-weight: bold; border: 2px solid #666; border-radius: 6px; background: #fff; }
        button.selected { background-color: #000 !important; color: #fff !important; }
    </style>
</head>
<body>
    <div id="fixed-header">
        <div class="disclaimer">参考値。現場確認必須。損害責任負いません。</div>
        
        <div class="app-title">クレーン判定アプリ（仮）</div>
        
        <div id="display-panel">
            <div class="ratio-wrapper">
                <div class="status-label" id="status-label">待機中</div>
                <div class="result-main" id="ratio-display">--%</div>
            </div>
            <div class="info-wrapper">
                <div id="recommend-text" style="color:#f00;">STEP 1から入力</div>
                <div id="result-detail" style="font-size:0.8rem; margin-top:2px;"></div>
            </div>
        </div>
    </div>

    <div id="content">
        <h2>STEP 1：車両設置・環境</h2>
        <div class="grid cols-2">
            <button onclick="selectItem('crane', 'GR1000N', this)" id="btn-GR1000N">100t (GR1000N)</button>
            <button disabled>(他機種追加用)</button>
        </div>
        <div id="step-area-all" style="display:none;">
            <h3>アウトリガー張出幅（m）</h3>
            <div class="grid cols-4">
                <button onclick="selectItem('outrigger', '7.8', this)" id="out-78">最大 7.8</button>
                <button onclick="selectItem('outrigger', '7.2', this)">7.2</button>
                <button onclick="selectItem('outrigger', '5.38', this)">5.38</button>
                <button onclick="selectItem('outrigger', '2.36', this)">最小 2.36</button>
            </div>
            <h3>カウンターウエイト (CW)</h3>
            <div class="grid cols-2">
                <button onclick="selectItem('cw', '4.0', this)" id="cw-4">装着 4.0t</button>
                <button onclick="selectItem('cw', '0.0', this)">無し 0.0t</button>
            </div>

            <h2>STEP 2：最終構成の確定</h2>
            <div class="grid cols-2">
                <button onclick="selectItem('mode', 'main', this)" id="mode-main">メインブーム</button>
                <button onclick="selectItem('mode', 'jib', this)" id="mode-jib">ジブ使用</button>
            </div>
            <div id="jib-options" style="display:none; background: #fff; border: 2px solid #333; padding: 10px; border-radius: 8px; margin-bottom: 12px;">
                <div class="grid cols-3" id="jib-len-btns">
                    <button onclick="selectItem('jibLen', '8.4', this)">8.4m</button>
                    <button onclick="selectItem('jibLen', '13.1', this)">13.1m</button>
                    <button onclick="selectItem('jibLen', '17.7', this)">17.7m</button>
                </div>
                <div class="grid cols-4" id="jib-off-btns" style="margin-top:8px;">
                    <button onclick="selectItem('offset', '5', this)">5°</button>
                    <button onclick="selectItem('offset', '25', this)">25°</button>
                    <button onclick="selectItem('offset', '45', this)">45°</button>
                    <button onclick="selectItem('offset', '60', this)">60°</button>
                </div>
            </div>
            <h3>使用フック選択</h3>
            <div class="grid cols-3">
                <button onclick="selectItem('hook', '50t', this)" id="hook-50">50t</button>
                <button onclick="selectItem('hook', '35t', this)">35t</button>
                <button onclick="selectItem('hook', '5t', this)" id="hook-5">補巻</button>
            </div>

            <h2>STEP 3：荷物情報</h2>
            <h3>作業半径（m）</h3>
            <input type="number" class="input-view" id="radius" placeholder="0.0" oninput="inputNum(this)" step="0.1">
            <h3>荷物の純重量（t）</h3>
            <input type="number" class="input-view" id="weight" placeholder="0.0" oninput="inputNum(this)" step="0.1">

            <h2>STEP 4：揚程計画（m）</h2>
            <h3>地切り高さ <span class="red-note">※地上から荷物の底面まで</span></h3>
            <input type="number" class="input-view" id="h1" placeholder="0.0" oninput="inputNum(this)" step="0.1">
            <h3>荷物の高さ</h3>
            <input type="number" class="input-view" id="h2" placeholder="0.0" oninput="inputNum(this)" step="0.1">
            <h3>吊具の長さ <span class="red-note">※先端〜吊具間1.9mは自動加算</span></h3>
            <input type="number" class="input-view" id="h3" placeholder="0.0" oninput="inputNum(this)" step="0.1">
        </div>
    </div>

    <script>
        const specs = {
            "GR1000N": {
                maxHeight: 66.0, maxReach: 65.7,
                hooks: { "50t": {w: 0.43, l: 1.41}, "35t": {w: 0.30, l: 1.3}, "5t": {w: 0.11, l: 0.73} },
                charts: {
                    "7.8_4.0": { 5:45.9, 10:21.3, 15:12.5, 20:8.75, 25:5.8, 30:4.4, 35:3.2, 40:1.95, 44:1.45 },
                    "7.8_0.0": { 5:44.7, 10:20.1, 15:11.1, 20:7.15, 25:4.6, 30:3.65, 35:2.45, 40:1.2, 44:0.75 },
                    "2.36_4.0": { 5:12.0, 10:5.5, 15:2.8 }
                },
                jibCharts: {
                    "8.4": { "5": {10:4.0, 20:3.4, 30:2.5, 40:1.45} }
                }
            }
        };

        let state = { crane: "", outrigger: '7.8', cw: '4.0', mode: 'main', jibLen: "", offset: "", hook: '50t', radius: "", weight: "", h1: "", h2: "", h3: "" };

        function selectItem(t, v, b) {
            if (t === 'mode' && v === 'jib') { state.jibLen = ""; state.offset = ""; document.querySelectorAll('#jib-len-btns button, #jib-off-btns button').forEach(x => x.classList.remove('selected')); }
            state[t] = v;
            b.parentElement.querySelectorAll('button').forEach(x => x.classList.remove('selected'));
            b.classList.add('selected');
            if (t === 'crane') document.getElementById('step-area-all').style.display='block';
            if (t === 'mode') { document.getElementById('jib-options').style.display = (v==='jib'?'block':'none'); state.hook = (v==='jib'?'5t':'50t'); updateHookButtons(state.hook); }
            calculate();
        }

        function updateHookButtons(h) {
            document.querySelectorAll('#hook-50, #hook-35, #hook-5').forEach(btn => btn.classList.remove('selected'));
            if(h==='50t') document.getElementById('hook-50').classList.add('selected');
            if(h==='35t') document.getElementById('hook-35').classList.add('selected');
            if(h==='5t') document.getElementById('hook-5').classList.add('selected');
        }

        function inputNum(input) { state[input.id] = input.value; calculate(); }

        function calculate() {
            if (!state.crane) return;
            const sp = specs[state.crane];
            const rawR = parseFloat(state.radius) || 0;
            const r_ceil = Math.ceil(rawR);
            const w_val = parseFloat(state.weight) || 0;
            const h_val = (parseFloat(state.h1)||0) + (parseFloat(state.h2)||0) + (parseFloat(state.h3)||0) + 1.9 + sp.hooks[state.hook].l;
            const len = Math.sqrt(rawR * rawR + h_val * h_val);

            const ratioDisp = document.getElementById('ratio-display');
            const panel = document.getElementById('display-panel');
            const statusLabel = document.getElementById('status-label');
            const recText = document.getElementById('recommend-text');
            const detail = document.getElementById('result-detail');

            let missing = [];
            if (!state.radius) missing.push("半径"); if (!state.weight) missing.push("重量");
            if (!state.h1 || !state.h2 || !state.h3) missing.push("揚程情報");
            if (state.mode === 'jib' && (!state.jibLen || !state.offset)) missing.push("ジブ構成");

            if (missing.length > 0) {
                ratioDisp.innerText = "--%"; statusLabel.innerText = "未入力";
                panel.style.backgroundColor = 'var(--waiting)';
                recText.innerHTML = `<span style="color:#f00">未入力: ${missing.join(', ')}</span>`;
                detail.innerText = ""; return;
            }

            if (h_val > sp.maxHeight || len > sp.maxReach) {
                ratioDisp.innerText = "限界"; statusLabel.innerText = "能力外";
                panel.style.backgroundColor = 'var(--bg-error)';
                recText.innerHTML = `<span style="color:#f00">能力外です</span>`;
                return;
            }

            let rated = 0;
            if (state.mode === 'main') {
                let chartKey = `${state.outrigger}_${state.cw}`;
                const chart = sp.charts[chartKey] || sp.charts["2.36_4.0"];
                rated = chart[r_ceil] || (r_ceil < 5 ? chart[5] : 0);
                if (r_ceil > 44 || len > 48.0) rated = 0;
            } else {
                let baseJib = sp.jibCharts["8.4"]["5"][r_ceil] || 0;
                rated = (state.cw === '0.0') ? baseJib * 0.7 : baseJib; 
                if (state.outrigger !== '7.8') rated = 0;
            }

            const total = w_val + sp.hooks[state.hook].w;
            const ratio = rated > 0 ? (total / rated) * 100 : 0;
