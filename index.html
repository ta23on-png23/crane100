<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>クレーン施工提案アプリ V67</title>
    <style>
        :root { --bg-success: #ccffcc; --bg-caution: #ffff99; --bg-error: #ffcccc; --accent: #000080; }
        body { font-family: sans-serif; margin: 0; padding: 0; background-color: #f5f5f5; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #fff; padding: 10px; border-bottom: 2px solid #ccc; flex-shrink: 0; }
        .app-title { color: var(--accent); font-size: 1.6rem; font-weight: 900; text-align: center; margin: 5px 0; }
        .crane-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 5px 0; }
        .crane-btn { height: 60px; font-size: 1rem; font-weight: 900; border: 3px solid #666; border-radius: 8px; background: #fff; }
        .crane-btn.selected { background: var(--accent) !important; color: #fff !important; }
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .input-side { width: 42%; padding: 15px; overflow-y: auto; border-right: 2px solid #ccc; background: #eee; }
        .output-side { width: 58%; padding: 15px; overflow-y: auto; background: #fff; }
        h2 { font-size: 1.1rem; border-left: 10px solid var(--accent); background: #ddd; padding: 6px 15px; margin: 10px 0; border-radius: 4px; }
        .input-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .clear-box-btn { width: 45px; height: 45px; background: #999; color: #fff; border: none; border-radius: 8px; font-size: 1.5rem; font-weight: bold; }
        label { font-size: 0.9rem; font-weight: bold; color: #444; display: block; margin-bottom: 2px; }
        .input-view { width: 100%; font-size: 1.7rem; padding: 8px; border: 3px solid #333; border-radius: 8px; box-sizing: border-box; text-align: right; font-weight: bold; }
        .suggestion-card { border: 2px solid #333; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        .card-header { display: flex; align-items: center; margin-bottom: 8px; }
        .suggest-ratio { flex: 0 0 85px; text-align: center; font-size: 2.2rem; font-weight: 900; border-right: 2px solid #ccc; padding-right: 10px; }
        .suggest-info { flex: 1; padding-left: 15px; font-size: 1.1rem; font-weight: bold; }
        .evidence-box { background: #f0f0f0; border: 1px dashed #666; padding: 8px; font-size: 0.8rem; border-radius: 6px; }
    </style>
</head>
<body>
    <header><div class="app-title">クレーン施工提案アプリ</div><div id="crane-buttons" class="crane-selector"></div></header>
    <div class="main-layout">
        <div class="input-side">
            <h2>条件入力</h2>
            <div id="input-fields"></div>
        </div>
        <div class="output-side">
            <h2>推奨構成案</h2>
            <div id="suggestion-list"></div>
        </div>
    </div>
    <script>
        let CRANE_DB = {};
        let state = { crane: "", out: "4.75", radius: "", weight: "" };

        fetch('cranes.json?' + new Date().getTime()).then(res => res.json()).then(data => { 
            CRANE_DB = data; 
            initApp(); 
        });

        function initApp() {
            const btnArea = document.getElementById('crane-buttons');
            Object.keys(CRANE_DB).forEach(key => {
                const btn = document.createElement('button');
                btn.className = 'crane-btn';
                btn.innerHTML = CRANE_DB[key].name.replace(' (', '<br>(');
                btn.onclick = (e) => {
                    state.crane = key;
                    document.querySelectorAll('.crane-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    propose();
                };
                btnArea.appendChild(btn);
            });
            const fields = [{id:'radius', l:'作業半径 (m)'}, {id:'weight', l:'純重量 (t)'}];
            const area = document.getElementById('input-fields');
            fields.forEach(f => {
                area.innerHTML += `<div class="input-group"><label>${f.l}</label><div class="input-row"><button class="clear-box-btn" onclick="clearField('${f.id}')">×</button><div style="flex:1"><input type="text" inputmode="decimal" class="input-view" id="${f.id}" oninput="validateAndInput(this)"></div></div></div>`;
            });
        }

        function clearField(id) { document.getElementById(id).value = ""; state[id] = ""; propose(); }
        function validateAndInput(el) {
            let val = el.value.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0)).replace(/．/g, ".").replace(/[^0-9.]/g, "");
            el.value = val; state[el.id] = val; propose();
        }

        function propose() {
            const list = document.getElementById('suggestion-list');
            if (!state.crane || !state.radius || !state.weight) {
                list.innerHTML = `<div style="color:#888; text-align:center; padding:60px;">機種を選択し、半径と重量を入力してください。</div>`;
                return;
            }
            const crane = CRANE_DB[state.crane];
            const r_in = parseFloat(state.radius);
            const w_in = parseFloat(state.weight);
            const outTable = crane.outriggers["4.75"];
            
            let results = [];
            crane.booms.forEach(len => {
                const chart = outTable.data[len.toString()];
                if(!chart) return;
                
                // 半径の次点検索（例: 10.1m -> 11.0mを参照）
                const dists = Object.keys(chart).filter(k => k !== 'danger').map(Number).sort((a,b)=>a-b);
                let refR = null;
                for(let d of dists){ if(r_in <= d){ refR = d; break; } }
                
                if (refR !== null) {
                    let rated = chart[refR.toString()];
                    let totalW = w_in + crane.hookW.main;
                    let ratio = (totalW / rated) * 100;
                    
                    if (ratio < 110) {
                        results.push({
                            len: len, ratio: Math.round(ratio), rated: rated, 
                            total: totalW, refR: refR, page: outTable.page,
                            parts: crane.boomParts[len.toString()]
                        });
                    }
                }
            });

            results.sort((a,b) => a.ratio - b.ratio);
            if (results.length === 0) {
                list.innerHTML = `<div style="color:#f00; text-align:center; padding:60px;">安全範囲外です（能力不足）</div>`;
            } else {
                list.innerHTML = results.map(res => `
                    <div class="suggestion-card" style="background-color: ${res.ratio < 80 ? 'var(--bg-success)' : (res.ratio < 90 ? 'var(--bg-caution)' : 'var(--bg-error)')}">
                        <div class="card-header">
                            <div class="suggest-ratio">${res.ratio}%</div>
                            <div class="suggest-info">${res.len}mブーム / ${res.parts}本掛<br>定格: ${res.rated.toFixed(2)}t</div>
                        </div>
                        <div class="evidence-box">P.${res.page}参照 / 半径${res.refR.toFixed(1)}mの値を採用</div>
                    </div>`).join('');
            }
        }
    </script>
</body>
</html>
