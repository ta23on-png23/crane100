<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>クレーン施工提案アプリ V63</title>
    <style>
        :root { --bg-safe: #ffffff; --bg-success: #ccffcc; --bg-caution: #ffff99; --bg-danger: #ffe0e0; --bg-error: #ffcccc; --accent: #000080; }
        body { font-family: sans-serif; margin: 0; padding: 0; background-color: #f5f5f5; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #fff; padding: 10px; border-bottom: 2px solid #ccc; flex-shrink: 0; }
        .disclaimer { color: #f00; font-size: 0.7rem; font-weight: bold; text-align: center; border: 1px solid #f00; padding: 2px; }
        .app-title { color: var(--accent); font-size: 1.6rem; font-weight: 900; text-align: center; margin: 8px 0; }
        .crane-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 5px 0; }
        .crane-btn { height: 60px; font-size: 1rem; font-weight: 900; border: 3px solid #666; border-radius: 8px; background: #fff; line-height: 1.2; }
        .crane-btn.selected { background: var(--accent); color: #fff; border-color: var(--accent); }
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .input-side { width: 42%; padding: 15px; overflow-y: auto; border-right: 2px solid #ccc; background: #eee; }
        .output-side { width: 58%; padding: 15px; overflow-y: auto; background: #fff; }
        h2 { font-size: 1.1rem; border-left: 10px solid var(--accent); background: #ddd; padding: 6px 15px; margin: 10px 0; border-radius: 4px; }
        .outrigger-selector { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 10px; }
        .out-btn { height: 45px; font-size: 0.8rem; font-weight: bold; border: 2px solid #666; border-radius: 5px; background: #fff; }
        .out-btn.selected { background: #333; color: #fff; }
        .input-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .clear-box-btn { width: 45px; height: 45px; background: #999; color: #fff; border: none; border-radius: 8px; font-size: 1.5rem; font-weight: bold; flex-shrink: 0; }
        .input-wrap { flex: 1; }
        label { font-size: 0.9rem; font-weight: bold; color: #444; display: block; margin-bottom: 2px; }
        .input-view { width: 100%; font-size: 1.7rem; padding: 8px; border: 3px solid #333; border-radius: 8px; box-sizing: border-box; text-align: right; font-weight: bold; background: #fff; }
        .suggestion-card { border: 2px solid #333; border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; align-items: center; box-shadow: 0 3px 5px rgba(0,0,0,0.1); }
        .suggest-ratio { flex: 0 0 85px; text-align: center; font-size: 2rem; font-weight: 900; border-right: 2px solid #ccc; padding-right: 10px; }
        .suggest-info { flex: 1; padding-left: 15px; font-size: 0.9rem; line-height: 1.4; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; background: var(--accent); color: #fff; font-size: 0.8rem; margin-bottom: 4px; }
        .badge-jib { background: #c00; }
        .angle-val { color: #d35400; font-weight: 900; font-size: 1.1rem; }
        .danger-val { color: #f00; font-weight: bold; font-size: 0.75rem; }
        .btn-reset-all { width: 100%; height: 55px; background: #444; color: #fff; font-weight: bold; border: none; border-radius: 10px; margin-top: 15px; font-size: 1.2rem; }
    </style>
</head>
<body>
    <header>
        <div class="disclaimer">参考値。現場確認必須。損害責任負いません。</div>
        <div class="app-title">クレーン施工提案アプリ</div>
        <div id="crane-buttons" class="crane-selector"></div>
    </header>
    <div class="main-layout">
        <div class="input-side">
            <h2>アウトリガー張出 (m)</h2>
            <div id="outrigger-area" class="outrigger-selector">
                <button class="out-btn selected" onclick="setOut('4.75', this)">最大<br>4.75</button>
                <button class="out-btn" onclick="setOut('4.3', this)">4.3</button>
                <button class="out-btn" onclick="setOut('3.7', this)">3.7</button>
                <button class="out-btn" onclick="setOut('2.7', this)">2.7</button>
                <button class="out-btn" onclick="setOut('1.64', this)">最小<br>1.64</button>
            </div>
            <h2>条件入力</h2>
            <div id="input-fields"></div>
            <button class="btn-reset-all" onclick="resetAll()">全数値をクリア</button>
        </div>
        <div class="output-side">
            <h2>推奨構成案 (低負荷順)</h2>
            <div id="suggestion-list"></div>
        </div>
    </div>

    <script>
        let CRANE_DB = {};
        let state = { crane: "", out: "4.75", radius: "", weight: "", h_max: "", h_load: "", h_tool: "" };

        fetch('cranes.json').then(res => res.json()).then(data => { CRANE_DB = data; initApp(); });

        function initApp() {
            const btnArea = document.getElementById('crane-buttons');
            Object.keys(CRANE_DB).forEach(key => {
                const btn = document.createElement('button');
                btn.className = 'crane-btn';
                btn.innerHTML = CRANE_DB[key].name.replace(' (', '<br>(');
                btn.onclick = (e) => selectCrane(key, e.currentTarget);
                btnArea.appendChild(btn);
            });
            const fields = [{id:'radius', l:'作業半径 (m)'}, {id:'weight', l:'純重量 (t)'}, {id:'h_max', l:'着地高 (m)'}, {id:'h_load', l:'荷物高 (m)'}, {id:'h_tool', l:'吊具長 (m)'}];
            const area = document.getElementById('input-fields');
            fields.forEach(f => {
                area.innerHTML += `<div class="input-group"><label>${f.l}</label><div class="input-row"><button class="clear-box-btn" onclick="clearField('${f.id}')">×</button><div class="input-wrap"><input type="text" inputmode="decimal" class="input-view" id="${f.id}" placeholder="0.0" oninput="validateAndInput(this)"></div></div></div>`;
            });
        }

        function setOut(val, btn) {
            state.out = val;
            document.querySelectorAll('.out-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            propose();
        }

        function clearField(id) { document.getElementById(id).value = ""; state[id] = ""; propose(); }
        function validateAndInput(el) {
            let val = el.value.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0)).replace(/．/g, ".").replace(/[^0-9.]/g, "");
            el.value = val; state[el.id] = val; propose();
        }
        function selectCrane(id, btn) {
            state.crane = id;
            document.querySelectorAll('.crane-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            propose();
        }
        function resetAll() {
            Object.keys(state).forEach(k => { if(k!=='crane' && k!=='out') state[k]=""; });
            document.querySelectorAll('.input-view').forEach(el => el.value = "");
            propose();
        }

        function propose() {
            const list = document.getElementById('suggestion-list');
            if (!state.crane || !state.radius || !state.weight || !state.h_max) {
                list.innerHTML = `<div style="color:#888; text-align:center; padding:60px;">条件を入力してください。</div>`;
                return;
            }
            const crane = CRANE_DB[state.crane];
            const r = parseFloat(state.radius);
            const w = parseFloat(state.weight);
            // 必要揚程の計算（フック分などを引く前のベースとなる高さ）
            const h_req = (parseFloat(state.h_max)||0) + (parseFloat(state.h_load)||0) + (parseFloat(state.h_tool)||0);
            
            let results = [];
            const outTable = crane.outriggers[state.out] || crane.outriggers["4.75"];

            // メインブーム
            crane.booms.forEach(len => {
                const chart = outTable[len.toString()];
                if(!chart) return;
                
                // 定格の取得
                let rated = 0;
                const dists = Object.keys(chart).filter(k => k !== 'danger').map(Number).sort((a,b)=>a-b);
                for(let d of dists){ if(r <= d){ rated = chart[d]; break; } }
                
                let totalW = w + crane.hookW.main;
                let ratio = rated > 0 ? (totalW / rated) * 100 : 999;
                
                // 角度と高さの計算
                let angle = (len >= r) ? Math.acos(r / len) * (180 / Math.PI) : 0;
                let h_limit = (len >= r) ? Math.sqrt(len*len - r*r) + 1.5 : 0; // 地上高1.5mプラス

                // 判定：負荷105%以内 かつ 危険角度以上 かつ 高さが足りる
                if (rated > 0 && ratio < 105 && angle >= chart.danger && h_limit >= (h_req + crane.hookL.main)) {
                    results.push({ 
                        type: 'ブーム', val: len, ratio: Math.round(ratio), rated: rated, 
                        total: totalW, angle: angle.toFixed(1), danger: chart.danger, 
                        parts: crane.boomParts[len.toString()] 
                    });
                }
            });

            // ジブ
            crane.jibs.forEach(j => {
                let rated = 0;
                const dists = Object.keys(j.charts).filter(k => k !== 'danger').map(Number).sort((a,b)=>a-b);
                for(let d of dists){ if(r <= d){ rated = j.charts[d]; break; } }
                
                let totalW = w + crane.hookW.sub;
                let ratio = rated > 0 ? (totalW / rated) * 100 : 999;
                
                // ジブ使用時は24mブーム＋ジブ長で簡易角度計算
                const totalLen = 24.0 + j.len;
                let angle = (totalLen >= r) ? Math.acos(r / totalLen) * (180 / Math.PI) : 0;
                let h_limit = (totalLen >= r) ? Math.sqrt(totalLen*totalLen - r*r) + 1.5 : 0;

                if (rated > 0 && ratio < 105 && angle >= j.danger) {
                    results.push({ 
                        type: 'ジブ', val: j.len, ratio: Math.round(ratio), rated: rated, 
                        total: totalW, angle: angle.toFixed(1), danger: j.danger, parts: j.parts 
                    });
                }
            });

            results.sort((a,b) => a.ratio - b.ratio);
            if (results.length === 0) {
                list.innerHTML = `<div style="color:#f00; font-weight:bold; text-align:center; padding:60px;">条件に合う構成が見つかりません。<br><small>（半径・高さ・危険角度のいずれかが制限を超えています）</small></div>`;
            } else {
                list.innerHTML = results.map(res => `
                    <div class="suggestion-card" style="background-color: ${res.ratio < 80 ? 'var(--bg-success)' : (res.ratio < 90 ? 'var(--bg-caution)' : 'var(--bg-error)')}">
                        <div class="suggest-ratio">${res.ratio}%</div>
                        <div class="suggest-info">
                            <span class="badge ${res.type==='ジブ'?'badge-jib':''}">${res.type} ${res.val}m / ${res.parts}本掛</span><br>
                            角度: <span class="angle-val">${res.angle}°</span> 
                            <span class="danger-val">(危険:${res.danger}°)</span><br>
                            定格: ${res.rated.toFixed(2)}t / 負荷合計: ${res.total.toFixed(2)}t
                        </div>
                    </div>`).join('');
            }
        }
    </script>
</body>
</html>
