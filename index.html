<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>クレーン施工提案システム V53</title>
    <style>
        :root { --bg-safe: #ffffff; --bg-success: #ccffcc; --bg-caution: #ffff99; --bg-error: #ffcccc; --accent: #000080; }
        body { font-family: sans-serif; margin: 0; padding: 0; background-color: #f5f5f5; display: flex; flex-direction: column; height: 100vh; }
        
        /* ヘッダー固定 */
        header { background: #fff; padding: 10px; border-bottom: 2px solid #ccc; flex-shrink: 0; }
        .disclaimer { color: #f00; font-size: 0.7rem; font-weight: bold; text-align: center; border: 1px solid #f00; padding: 2px; }
        .app-title { color: var(--accent); font-size: 1.3rem; font-weight: 900; text-align: center; margin: 5px 0; }

        /* メインレイアウト（iPad用） */
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .input-side { width: 40%; padding: 15px; overflow-y: auto; border-right: 2px solid #ccc; background: #eee; }
        .output-side { width: 60%; padding: 15px; overflow-y: auto; background: #fff; }

        h2 { font-size: 1.1rem; border-left: 8px solid var(--accent); background: #ddd; padding: 5px 10px; margin: 15px 0 10px; }
        .input-group { margin-bottom: 12px; }
        label { font-size: 0.9rem; font-weight: bold; color: #555; display: block; }
        .input-view { width: 100%; font-size: 1.5rem; padding: 8px; border: 2px solid #333; border-radius: 6px; box-sizing: border-box; text-align: right; font-weight: bold; }
        
        /* 機種選択ボタン（6機種分） */
        .crane-selector { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 10px; }
        .crane-btn { height: 45px; font-size: 0.8rem; font-weight: bold; border: 2px solid #666; border-radius: 5px; background: #fff; }
        .crane-btn.selected { background: var(--accent); color: #fff; }

        /* 提案リストのデザイン */
        .suggestion-card { border: 2px solid #333; border-radius: 8px; padding: 10px; margin-bottom: 10px; display: flex; align-items: center; transition: 0.3s; }
        .suggest-ratio { flex: 0 0 80px; text-align: center; font-size: 1.8rem; font-weight: 900; border-right: 2px solid #ccc; padding-right: 10px; }
        .suggest-info { flex: 1; padding-left: 15px; font-size: 0.95rem; line-height: 1.4; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; background: #000; color: #fff; font-size: 0.8rem; margin-bottom: 5px; }

        .btn-reset { width: 100%; height: 50px; background: #666; color: #fff; font-weight: bold; border: none; border-radius: 8px; margin-top: 20px; font-size: 1.1rem; }

        @media (max-width: 768px) {
            .main-layout { flex-direction: column; }
            .input-side, .output-side { width: 100%; height: auto; border: none; }
        }
    </style>
</head>
<body>
    <header>
        <div class="disclaimer">参考値。現場確認必須。損害責任負いません。</div>
        <div class="app-title">クレーン施工提案システム</div>
        <div class="crane-selector">
            <button class="crane-btn" onclick="selectCrane('MR-130Rf', this)" id="btn-MR-130Rf">13t (MR-130Rf)</button>
            <button class="crane-btn" disabled>機種2(未)</button>
            <button class="crane-btn" disabled>機種3(未)</button>
            <button class="crane-btn" disabled>機種4(未)</button>
            <button class="crane-btn" disabled>機種5(未)</button>
            <button class="crane-btn" disabled>機種6(未)</button>
        </div>
    </header>

    <div class="main-layout">
        <div class="input-side">
            <h2>荷物・条件入力</h2>
            <div class="input-group">
                <label>作業半径 (m)</label>
                <input type="text" inputmode="decimal" class="input-view" id="radius" placeholder="0.0" oninput="validateAndInput(this)">
            </div>
            <div class="input-group">
                <label>荷物の純重量 (t)</label>
                <input type="text" inputmode="decimal" class="input-view" id="weight" placeholder="0.0" oninput="validateAndInput(this)">
            </div>
            <div class="input-group">
                <label>着地場所・最大高さ (m)</label>
                <input type="text" inputmode="decimal" class="input-view" id="h_max" placeholder="0.0" oninput="validateAndInput(this)">
            </div>
            <div class="input-group">
                <label>荷物の高さ (m)</label>
                <input type="text" inputmode="decimal" class="input-view" id="h_load" placeholder="0.0" oninput="validateAndInput(this)">
            </div>
            <div class="input-group">
                <label>吊具の長さ (m)</label>
                <input type="text" inputmode="decimal" class="input-view" id="h_tool" placeholder="0.0" oninput="validateAndInput(this)">
            </div>
            <button class="btn-reset" onclick="resetAll()">全入力をクリア</button>
        </div>

        <div class="output-side">
            <h2>推奨構成案 (低負荷順)</h2>
            <div id="suggestion-list">
                <div style="color:#888; text-align:center; padding:50px;">条件を入力すると、<br>最適なブーム・ジブ構成を提案します。</div>
            </div>
        </div>
    </div>

    <script>
        // MR-130Rf データベース (抜粋) [cite: 35, 39, 41, 44, 47, 49, 52, 56, 182]
        const CRANE_DB = {
            "MR-130Rf": {
                name: "13t (MR-130Rf)",
                maxH: 24.8, maxReach: 24.0, // [cite: 63, 62]
                hookW: { main: 0.09, sub: 0.025 }, // [cite: 182]
                hookL: { main: 1.0, sub: 0.5 },
                booms: [5.3, 9.04, 12.78, 16.52, 20.26, 24.0], // [cite: 35, 39, 41, 44, 47, 49]
                charts: {
                    // 最大張出4.75m/CW固定の暫定データ [cite: 81, 268]
                    "7.8": { 5:9.0, 10:4.5, 15:2.5, 20:1.3, 24:0.8 } 
                },
                jibs: [
                    { len: 3.6, offset: [5, 25, 45, 60] }, // [cite: 52]
                    { len: 5.5, offset: [5, 25, 45, 60] }  // [cite: 56]
                ]
            }
        };

        let state = { crane: "", radius: "", weight: "", h_max: "", h_load: "", h_tool: "" };

        function validateAndInput(el) {
            let val = el.value.replace(/[０-９]/g, s => String.fromCharCode(s.charCodeAt(0) - 0xFEE0)).replace(/．/g, ".").replace(/[^0-9.]/g, "");
            const parts = val.split("."); if (parts.length > 2) val = parts[0] + "." + parts.slice(1).join("");
            el.value = val; state[el.id] = val; propose();
        }

        function selectCrane(id, btn) {
            state.crane = id;
            document.querySelectorAll('.crane-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            propose();
        }

        function resetAll() {
            const currentCrane = state.crane;
            state = { crane: currentCrane, radius: "", weight: "", h_max: "", h_load: "", h_tool: "" };
            document.querySelectorAll('.input-view').forEach(el => el.value = "");
            propose();
        }

        function propose() {
            const list = document.getElementById('suggestion-list');
            if (!state.crane || !state.radius || !state.weight || !state.h_max) {
                list.innerHTML = `<div style="color:#888; text-align:center; padding:50px;">条件を入力すると、最適な構成を提案します。</div>`;
                return;
            }

            const crane = CRANE_DB[state.crane];
            const r = parseFloat(state.radius);
            const w = parseFloat(state.weight);
            const h_req = (parseFloat(state.h_max) || 0) + (parseFloat(state.h_load) || 0) + (parseFloat(state.h_tool) || 0) + 1.9 + crane.hookL.main;
            
            let results = [];

            // メインブーム全段数をチェック
            crane.booms.forEach(len => {
                // 本来はブーム長ごとのチャートを参照
                let rated = crane.charts["7.8"][Math.ceil(r)] || 0;
                let totalW = w + crane.hookW.main;
                let ratio = (totalW / rated) * 100;
                
                // 物理的な届き判定（簡易式）
                let reach_ok = Math.sqrt(r*r + h_req*h_req) <= len * 1.1; 

                if (rated > 0 && ratio < 105 && reach_ok) {
                    results.push({ type: 'ブーム', val: len, ratio: Math.round(ratio), rated: rated, total: totalW });
                }
            });

            // 負荷率（余裕）がある順にソート
            results.sort((a, b) => a.ratio - b.ratio);

            if (results.length === 0) {
                list.innerHTML = `<div style="color:#f00; font-weight:bold; text-align:center; padding:50px;">該当する安全な構成が見つかりません。<br>条件を見直してください。</div>`;
            } else {
                list.innerHTML = results.map(res => `
                    <div class="suggestion-card" style="background-color: ${res.ratio < 80 ? 'var(--bg-success)' : (res.ratio < 90 ? 'var(--bg-caution)' : 'var(--bg-error)')}">
                        <div class="suggest-ratio">${res.ratio}%</div>
                        <div class="suggest-info">
                            <span class="badge">${res.type} ${res.val}m</span><br>
                            <strong>定格: ${res.rated.toFixed(2)}t</strong> / 負荷: ${res.total.toFixed(2)}t<br>
                            <small>必要揚程: ${h_req.toFixed(1)}m をクリア</small>
                        </div>
                    </div>
                `).join('');
            }
        }
    </script>
</body>
</html>
