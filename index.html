<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>クレーン施工検討アプリ V43 - UI刷新版</title>
    <style>
        :root { --bg-safe: #ffffff; --bg-caution: #ffff99; --bg-danger: #ffcccc; --bg-error: #ff4444; --accent: #007bff; --success: #28a745; }
        body { font-family: sans-serif; margin: 0; padding: 0; background-color: #f0f0f0; color: #333; line-height: 1.4; }
        
        /* コンパクトになった固定ヘッダー */
        #fixed-header { position: sticky; top: 0; z-index: 1000; background: #fff; border-bottom: 2px solid #ccc; padding: 5px 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .disclaimer { color: #f00; font-size: 0.8rem; font-weight: bold; border: 1px solid #f00; padding: 3px; background: #fff; text-align: center; margin-bottom: 5px; }
        
        #display-panel { display: flex; align-items: center; justify-content: space-between; border-radius: 8px; padding: 5px 10px; border: 2px solid #000; background-color: var(--bg-safe); }
        .ratio-wrapper { text-align: center; flex: 0 0 40%; }
        .status-label { font-size: 1rem; font-weight: bold; background: #000; color: #fff; padding: 1px 10px; border-radius: 4px; display: inline-block; margin-bottom: 2px; }
        .result-main { font-size: 3rem; font-weight: 900; line-height: 1.0; }
        .info-wrapper { text-align: left; flex: 1; margin-left: 10px; font-size: 0.9rem; font-weight: bold; border-left: 2px solid #ccc; padding-left: 10px; }
        .info-item { display: block; margin-bottom: 2px; }

        /* コンテンツエリア（スクロール可能） */
        #content { padding: 15px; padding-bottom: 50px; }
        h2 { font-size: 1.2rem; border-left: 8px solid #333; background: #ddd; padding: 5px 10px; margin: 15px 0 10px; border-radius: 2px; }
        h3 { font-size: 1rem; margin: 10px 0 5px; color: #555; }
        
        /* 入力欄（スマホ標準テンキー呼び出し） */
        .input-view { width: 100%; font-size: 1.5rem; padding: 10px; border: 2px solid #333; border-radius: 8px; box-sizing: border-box; text-align: right; font-weight: bold; margin-bottom: 10px; }
        .red-note { color: #f00; font-size: 0.8rem; font-weight: bold; display: block; margin-top: 2px; margin-bottom: 10px; }
        
        /* グリッドボタン */
        .grid { display: grid; gap: 8px; margin-bottom: 15px; }
        .cols-2 { grid-template-columns: repeat(2, 1fr); }
        .cols-3 { grid-template-columns: repeat(3, 1fr); }
        .cols-4 { grid-template-columns: repeat(4, 1fr); }
        button { height: 50px; font-size: 1rem; font-weight: bold; border: 2px solid #666; border-radius: 8px; background: #fff; color: #333; transition: 0.2s; }
        button.selected { background-color: #000 !important; color: #fff !important; border-color: #000; }
        button:disabled { opacity: 0.5; }
    </style>
</head>
<body>
    <div id="fixed-header">
        <div class="disclaimer">本アプリの計算結果は諸元表に基づく参考値です。生じた損害について一切の責任を負いません。</div>
        <div id="display-panel">
            <div class="ratio-wrapper">
                <div class="status-label" id="status-label">待機中</div>
                <div class="result-main"><span id="ratio-display">--%</span></div>
            </div>
            <div class="info-wrapper" id="info-wrapper">
                <span class="info-item txt-error" id="recommend-text">STEP 1から入力してください。</span>
                <span class="info-item" id="result-detail" style="display:none;">定格: -- t / 負荷: -- t</span>
            </div>
        </div>
    </div>

    <div id="content">
        <h2>STEP 1：車両設置・環境</h2>
        <div class="grid cols-2">
            <button onclick="selectItem('crane', 'GR1000N', this)" id="btn-GR1000N">100t (GR1000N)</button>
            <button disabled>(他機種追加用)</button>
        </div>
        <div id="step-area-all" style="display:none;">
            <h3>アウトリガー張出幅</h3>
            <div class="grid cols-4">
                <button onclick="selectItem('outrigger', '7.8', this)" id="out-78">最大 7.8</button>
                <button onclick="selectItem('outrigger', '7.2', this)">7.2m</button>
                <button onclick="selectItem('outrigger', '5.38', this)">5.38m</button>
                <button onclick="selectItem('outrigger', '2.36', this)">最小 2.36</button>
            </div>
            <h3>カウンタウエイト (CW)</h3>
            <div class="grid cols-2">
                <button onclick="selectItem('cw', '4.0', this)" id="cw-4">4.0t (装着)</button>
                <button onclick="selectItem('cw', '0.0', this)">0.0t (無し)</button>
            </div>

            <h2>STEP 2：最終構成の確定</h2>
            <div class="grid cols-2">
                <button onclick="selectItem('mode', 'main', this)" id="mode-main">メインブーム</button>
                <button onclick="selectItem('mode', 'jib', this)" id="mode-jib">ジブ使用</button>
            </div>
            <div id="jib-options" style="display:none; background: #fff; border: 2px solid #333; padding: 10px; border-radius: 8px; margin-bottom: 15px;">
                <div class="grid cols-3" id="jib-len-btns">
                    <button onclick="selectItem('jibLen', '8.4', this)">8.4m</button>
                    <button onclick="selectItem('jibLen', '13.1', this)">13.1m</button>
                    <button onclick="selectItem('jibLen', '17.7', this)">17.7m</button>
                </div>
                <div class="grid cols-4" id="jib-off-btns" style="margin-top:8px;">
                    <button onclick="selectItem('offset', '5', this)">5°</button>
                    <button onclick="selectItem('offset', '25', this)">25°</button>
                    <button onclick="selectItem('offset', '45', this)">45°</button>
                    <button onclick="selectItem('offset', '60', this)">60°</button>
                </div>
            </div>
            <h3>使用フック選択</h3>
            <div class="grid cols-3">
                <button onclick="selectItem('hook', '50t', this)" id="hook-50">50t</button>
                <button onclick="selectItem('hook', '35t', this)">35t</button>
                <button onclick="selectItem('hook', '5t', this)" id="hook-5">補巻</button>
            </div>

            <h2>STEP 3：荷物情報</h2>
            <h3>作業半径（m）</h3>
            <input type="number" class="input-view" id="radius" placeholder="0.0" oninput="inputNum(this)" step="0.1">
            <h3>荷物の純重量（t）</h3>
            <input type="number" class="input-view" id="weight" placeholder="0.0" oninput="inputNum(this)" step="0.1">

            <h2>STEP 4：揚程計画（m）</h2>
            <h3>地切り高さ <span class="red-note">※地上から荷物の底面まで</span></h3>
            <input type="number" class="input-view" id="h1" placeholder="0.0" oninput="inputNum(this)" step="0.1">
            <h3>荷物の高さ</h3>
            <input type="number" class="input-view" id="h2" placeholder="0.0" oninput="inputNum(this)" step="0.1">
            <h3>吊具の長さ <span class="red-note">※先端〜吊具間1.9mは自動加算</span></h3>
            <input type="number" class="input-view" id="h3" placeholder="0.0" oninput="inputNum(this)" step="0.1">
        </div>
    </div>

    <script>
        const specs = {
            "GR1000N": {
                maxTotalHeight: 66.0, maxReach: 65.7,
                hooks: { "50t": {w: 0.43, l: 1.41}, "35t": {w: 0.30, l: 1.3}, "5t": {w: 0.11, l: 0.73} },
                charts: {
                    "7.8_4.0": { 5:45.9, 10:21.3, 15:12.5, 20:8.75, 25:5.8, 30:4.4, 35:3.2, 40:1.95, 44:1.45 },
                    "7.8_0.0": { 5:44.7, 10:20.1, 15:11.1, 20:7.15, 25:4.6, 30:3.65, 35:2.45, 40:1.2, 44:0.75 },
                    "2.36_4.0": { 5:12.0, 10:5.5, 15:2.8, 20:1.4 }
                },
                jibCharts: {
                    "8.4": { "5": {10:4.0, 20:3.4, 30:2.5, 40:1.45}, "25": {15:3.5, 20:3.05, 30:2.35}, "45": {15:2.45, 20:2.3} }
                }
            }
        };

        let state = { crane: "", outrigger: '7.8', cw: '4.0', mode: 'main', jibLen: "", offset: "", hook: '50t', radius: "", weight: "", h1: "", h2: "", h3: "" };

        function selectItem(t, v, b) {
            if (t === 'mode' && v === 'jib') { state.jibLen = ""; state.offset = ""; document.querySelectorAll('#jib-len-btns button, #jib-off-btns button').forEach(x => x.classList.remove('selected')); }
            state[t] = v;
            b.parentElement.querySelectorAll('button').forEach(x => x.classList.remove('selected'));
            b.classList.add('selected');
            if (t === 'crane') document.getElementById('step-area-all').style.display='block';
            if (t === 'mode') { document.getElementById('jib-options').style.display = (v==='jib'?'block':'none'); state.hook = (v==='jib'?'5t':'50t'); updateHookButtons(state.hook); }
            calculate();
        }

        function updateHookButtons(h) {
            document.querySelectorAll('#hook-50, #hook-35, #hook-5').forEach(btn => btn.classList.remove('selected'));
            if(h==='50t') document.getElementById('hook-50').classList.add('selected');
            if(h==='35t') document.getElementById('hook-35').classList.add('selected');
            if(h==='5t') document.getElementById('hook-5').classList.add('selected');
        }

        function inputNum(input) {
            state[input.id] = input.value;
            calculate();
        }

        function calculate() {
            if (!state.crane) return;
            const sp = specs[state.crane];
            const rawR = parseFloat(state.radius) || 0;
            const r_ceil = Math.ceil(rawR);
            const w_val = parseFloat(state.weight) || 0;
            const h_val = (parseFloat(state.h1)||0) + (parseFloat(state.h2)||0) + (parseFloat(state.h3)||0) + 1.9 + sp.hooks[state.hook].l;
            const len = Math.sqrt(rawR * rawR + h_val * h_val);

            const ratioDisp = document.getElementById('ratio-display');
            const panel = document.getElementById('display-panel');
            const statusLabel = document.getElementById('status-label');
            const recommendText = document.getElementById('recommend-text');
            const resultDetail = document.getElementById('result-detail');

            // 未入力チェック
            let missing = [];
            if (!state.radius) missing.push("半径");
            if (!state.weight) missing.push("重量");
            if (!state.h1) missing.push("地切り");
            if (!state.h2) missing.push("荷高");
            if (!state.h3) missing.push("吊具");
            if (state.mode === 'jib' && (!state.jibLen || !state.offset)) missing.push("ジブ構成");

            if (missing.length > 0) {
                ratioDisp.innerText = "--%"; statusLabel.innerText = "未入力あり";
                panel.style.backgroundColor = 'var(--bg-danger)';
                recommendText.innerHTML = `<span class="txt-error">以下を入力： ${missing.join(', ')}</span>`;
                resultDetail.style.display = 'none';
                return;
            }

            // 物理限界チェック
            if (h_val > sp.maxTotalHeight || len > sp.maxReach) {
                ratioDisp.innerText = "限界"; statusLabel.innerText = "能力外";
                panel.style.backgroundColor = 'var(--bg-error)';
                recommendText.innerHTML = `<span class="txt-error">100t機の物理的限界を超えています！</span>`;
                resultDetail.style.display = 'none';
                return;
            }

            // メイン限界チェック
            if (len > 48.0 && state.mode === 'main') {
                recommendText.innerHTML = `<span class="txt-error">【メイン限界】ジブを使用してください</span>`;
            } else { recommendText.innerHTML = `<span class="txt-success">★判定結果を表示中</span>`; }
            resultDetail.style.display = 'block';

            let rated = 0;
            if (state.mode === 'main') {
                let chartKey = (state.outrigger === '2.36') ? `2.36_${state.cw}` : `7.8_${state.cw}`;
                rated = sp.charts[chartKey][r_ceil] || (r_ceil < 5 ? sp.charts[chartKey][5] : 0);
                if (r_ceil > 44 || len > 48.0) rated = 0;
            } else {
                rated = sp.jibCharts[state.jibLen]?.[state.offset]?.[r_ceil] || 0;
                if (state.outrigger !== '7.8') rated = 0;
            }

            const total = w_val + sp.hooks[state.hook].w;
            const ratio = rated > 0 ? (total / rated) * 100 : 0;

            if (rated === 0) {
                ratioDisp.innerText = "範囲外"; statusLabel.innerText = "不可";
                panel.style.backgroundColor = 'var(--bg-error)';
                resultDetail.innerText = `定格なし / 負荷: ${total.toFixed(1)}t`;
            } else {
                ratioDisp.innerText = Math.round(ratio) + "%";
                statusLabel.innerText = ratio >= 100 ? "オーバー" : "判定OK";
                resultDetail.innerText = `定格(${r_ceil}m): ${rated.toFixed(1)}t / 負荷合計: ${total.toFixed(1)}t`;
                panel.style.backgroundColor = ratio >= 100 ? 'var(--bg-error)' : (ratio >= 90 ? 'var(--bg-danger)' : (ratio >= 80 ? 'var(--bg-caution)' : '#fff'));
            }
        }
    </script>
</body>
</html>
